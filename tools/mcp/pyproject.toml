[project]
name = "magiceyes-mcp"
version = "0.1.0"
description = "MCP server for debugging the magiceyes GP2X/Wiz/Caanoo emulator"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0,<3.0.0",
    "numpy>=1.24",
]

[project.scripts]
magiceyes-mcp = "magiceyes_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["magiceyes_mcp"]
