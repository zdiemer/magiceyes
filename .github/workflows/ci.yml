name: CI

# Build the native Windows bundle (magiceyes.exe) on every push/PR so it never silently breaks.
# Cross-compiles with MinGW-w64 on an Ubuntu runner -- the same path as host/win/build_release.sh.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  windows-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix \
                                  cmake ninja-build python3 wget

      - name: Cache Unicorn fork (Windows static lib)
        uses: actions/cache@v4
        with:
          path: ~/me-unicorn-fork
          key: unicorn-fork-win-v1-${{ hashFiles('host/engine/fork-patches/*.py') }}

      - name: Cache SDL2 MinGW devel
        uses: actions/cache@v4
        with:
          path: ~/sdl2-mingw
          key: sdl2-mingw-2.30.9

      # Compile/link gate only: build magiceyes.exe but skip package.sh, which bundles the
      # gitignored firmware/game rootfs assets (rootfs-eabi, rootfs-win, Caanoo fonts) absent on a
      # clean CI checkout. The full asset bundle is packaged by release.yml / local builds.
      - name: Build bundle (exe-only)
        run: ME_BUILD_ONLY=1 bash host/win/build_release.sh "ci-${GITHUB_SHA::8}"

      # The debug control channel gives arbitrary guest memory read/write over a loopback socket.
      # It is compiled out of the release bundle (ME_BUNDLED && !ME_DEV) precisely so a shipping
      # consumer binary never opens a listening socket -- firewall prompts on a -mwindows app with
      # no console, AV heuristics, and 127.0.0.1 is not a security boundary on Windows. Assert it,
      # so the guarantee cannot regress silently.
      - name: Assert no control channel in the release binary
        run: |
          if strings -a bin/magiceyes.exe | grep -q "\[ctl\] listening"; then
            echo "::error::magiceyes.exe contains the debug control channel"
            exit 1
          fi
          # Read the symbols ONCE and prove we actually got some. Piping nm straight into grep
          # meant that if nm ever failed or the format changed, grep saw empty input and every
          # check "passed" -- a false green on the one guarantee this step exists to make.
          if ! syms="$(x86_64-w64-mingw32-nm -C --extern-only bin/magiceyes.exe)"; then
            echo "::error::could not read symbols from magiceyes.exe"
            exit 1
          fi
          if [ -z "$syms" ]; then
            echo "::error::nm produced no symbols for magiceyes.exe -- cannot verify anything"
            exit 1
          fi
          for sym in WSAStartup bind listen accept; do
            if printf '%s\n' "$syms" | grep -qw "$sym"; then
              echo "::error::magiceyes.exe imports $sym -- a listening socket must not ship"
              exit 1
            fi
          done
          echo "ok: release bundle has no control channel and no socket imports"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: magiceyes-win64
          path: |
            bin/magiceyes.exe
            bin/SDL2.dll
          if-no-files-found: error

  # Functional self-test of the Linux engine: ELF load + SVC syscalls + the structured run report
  # + ME_RUN_SECS clean stop. No game assets, no window -- so it can run unattended in CI and catch
  # gross breakage of the run path that the Windows compile-only job can't. Separate job so a fork
  # build hiccup never blocks the Windows artifact above.
  engine-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc gcc-arm-linux-gnueabi cmake ninja-build python3 git

      - name: Cache Unicorn fork (Linux static lib)
        id: forkcache
        uses: actions/cache@v4
        with:
          path: ~/me-unicorn-fork
          key: unicorn-fork-linux-v1-${{ hashFiles('host/engine/fork-patches/*.py') }}

      - name: Build Unicorn fork (Linux) + apply magiceyes patches
        if: steps.forkcache.outputs.cache-hit != 'true'
        run: |
          FORK="$HOME/me-unicorn-fork"
          git clone --depth 1 --branch 2.0.1 https://github.com/unicorn-engine/unicorn "$FORK"
          cmake -S "$FORK" -B "$FORK/build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DUNICORN_ARCH=arm
          bash host/engine/fork-patches/apply_and_build.sh

      - name: Build engine + run smoke
        run: |
          bash host/engine/build_engine.sh
          bash tools/test/smoke.sh

  # Unit tests over the pure logic: the GPEComp decompressor, the control-channel JSON codec, the
  # run-report sink, ELF symbol indexing, the storage paths, the firmware image walkers, the PNG
  # writer -- plus the whole Python harness layer (status tiers, the regression gate, the visual
  # grader, the pilot, the MCP data layer).
  #
  # Needs NO Unicorn fork build and NO ARM toolchain, so it is by far the fastest signal here: the
  # C files under test make zero uc_* calls and only need the unicorn HEADERS on the include path.
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libcmocka-dev git \
                                  gcc-mingw-w64-x86-64-posix cmake ninja-build

      - name: Fetch unicorn headers
        run: |
          # A shallow clone takes seconds; building the fork takes minutes, and nothing here
          # links against it.
          git clone --depth 1 --branch 2.0.1 \
            https://github.com/unicorn-engine/unicorn "$HOME/me-unicorn-fork"

      - name: C unit tests (Linux)
        run: bash tests/c/build_tests.sh

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Python unit tests
        run: bash tests/python/run_tests.sh

      - name: Cache cmocka (MinGW)
        id: cmockacache
        uses: actions/cache@v4
        with:
          path: ~/cmocka-mingw
          key: cmocka-mingw-1.1.7

      - name: Build cmocka (MinGW)
        if: steps.cmockacache.outputs.cache-hit != 'true'
        run: bash host/win/get_cmocka.sh

      # Cross-compiled here rather than on the Windows runner, so that runner needs no toolchain
      # at all: the binaries are -static.
      - name: Cross-build the C unit tests for Windows
        run: ME_TEST_WIN=1 ME_TEST_BUILD_ONLY=1 bash tests/c/build_tests.sh

      - name: Upload Windows test binaries
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-win64
          path: bin/tests/*.exe
          if-no-files-found: error

  # The same C tests again on real Windows. Worth the extra job because several of the things
  # under test are exactly where the platforms differ: the storage paths normalise separators, and
  # host/win/posix_compat.c (pread, mmap, the shm bridge) only exists on this side and is where
  # the native-Windows black-screen bugs lived.
  unit-tests-windows:
    runs-on: windows-latest
    needs: unit-tests
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: unit-tests-win64
          path: tests-win

      - name: Run the C unit tests (native Windows)
        shell: bash
        run: |
          fail=0
          for f in tests-win/*.exe; do
            echo "--- $(basename "$f")"
            "./$f" || fail=1
          done
          exit "$fail"
