name: Release

# Push a tag like v0.2.0 -> build the version-stamped Windows bundle and publish a GitHub release
# with magiceyes-<version>-win64.zip attached.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix \
                                  cmake ninja-build python3 wget

      - name: Cache Unicorn fork (Windows static lib)
        uses: actions/cache@v4
        with:
          path: ~/me-unicorn-fork
          key: unicorn-fork-win-v1-${{ hashFiles('host/engine/fork-patches/*.py') }}

      - name: Cache SDL2 MinGW devel
        uses: actions/cache@v4
        with:
          path: ~/sdl2-mingw
          key: sdl2-mingw-2.30.9

      # The firmware/game-derived runtime assets package.sh bundles (rootfs-eabi, rootfs-win,
      # Caanoo fonts, guest stubs) are gitignored and absent on a clean runner. They live on the
      # `release-assets` prerelease, refreshed by host/win/stage_release_assets.sh. Restore them to
      # the exact tree layout package.sh expects (assets/..., bin/guest/...).
      - name: Fetch staged release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download release-assets -R "$GITHUB_REPOSITORY" -p release-assets.tar.gz
          # The prerelease is refreshed by hand and is the one part of the zip that no commit
          # pins. v0.5.0 shipped a four-month-old runtime that way, and nothing failed. The
          # stamp pins it: this tag expects exactly the tarball it was staged against.
          want=$(awk '$1=="tarball_sha256"{print $2}' host/win/release-assets.stamp)
          have=$(sha256sum release-assets.tar.gz | cut -d" " -f1)
          if [ -z "$want" ]; then
            echo "::error::host/win/release-assets.stamp has no tarball_sha256"
            exit 1
          fi
          if [ "$want" != "$have" ]; then
            echo "::error::release-assets tarball is not the one this tag was staged against (stamp $want, downloaded $have): run host/win/stage_release_assets.sh and commit the stamp"
            exit 1
          fi
          echo "ok: staged runtime matches host/win/release-assets.stamp"
          tar xzf release-assets.tar.gz
          rm -f release-assets.tar.gz

      - name: Build + package (version from tag)
        run: bash host/win/build_release.sh "${GITHUB_REF_NAME#v}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Body: a committed docs/releases/RELEASE_NOTES_<version>.md is the curated changelog;
          # fall back to GitHub's auto-generated notes when there isn't one for this tag.
          NOTES_FILE="docs/releases/RELEASE_NOTES_${GITHUB_REF_NAME#v}.md"
          if [ -f "$NOTES_FILE" ]; then
            NOTES_ARGS=(--notes-file "$NOTES_FILE")
          else
            NOTES_ARGS=(--generate-notes)
          fi
          # Idempotent: if the release already exists (e.g. the first one was seeded
          # locally), just attach/refresh the asset instead of failing.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip \
              --title "magiceyes $GITHUB_REF_NAME" \
              "${NOTES_ARGS[@]}"
          fi
