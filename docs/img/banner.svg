<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="magiceyes: GP2X, GP2X Wiz and GP2X Caanoo games on your PC">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d1140"/>
      <stop offset="0.55" stop-color="#140d2b"/>
      <stop offset="1" stop-color="#090714"/>
    </linearGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7f6bff"/>
      <stop offset="1" stop-color="#2fd4c6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7f6bff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7f6bff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2fd4c6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="250" rx="18" fill="url(#bg)"/>

  <!-- LCD scanlines -->
  <g fill="#ffffff" opacity="0.03">
    <rect x="0" y="0" width="1200" height="2"/>
    <rect x="0" y="8" width="1200" height="2"/>
    <rect x="0" y="16" width="1200" height="2"/>
    <rect x="0" y="226" width="1200" height="2"/>
    <rect x="0" y="234" width="1200" height="2"/>
    <rect x="0" y="242" width="1200" height="2"/>
  </g>

  <!-- eye mark -->
  <g transform="translate(600 74)">
    <path d="M -66 0 C -39 -34, 39 -34, 66 0 C 39 34, -39 34, -66 0 Z"
          fill="none" stroke="#8d7dff" stroke-width="5" stroke-linejoin="round" opacity="0.9"/>
    <circle cx="0" cy="0" r="21" fill="url(#iris)"/>
    <rect x="-7" y="-7" width="14" height="14" fill="#0b0a1a" opacity="0.85"/>
    <rect x="7" y="-15" width="6" height="6" fill="#ffffff" opacity="0.9"/>
  </g>

  <text x="600" y="172" text-anchor="middle"
        font-family="Verdana, DejaVu Sans, Geneva, sans-serif" font-size="76" font-weight="bold"
        fill="#f4efff" letter-spacing="1">magiceyes</text>

  <text x="600" y="206" text-anchor="middle"
        font-family="Consolas, DejaVu Sans Mono, Menlo, monospace" font-size="19"
        fill="#9d8ed6" letter-spacing="6">GP2X &#183; GP2X WIZ &#183; GP2X CAANOO</text>

  <rect x="370" y="224" width="460" height="2" fill="url(#glow)"/>
</svg>
