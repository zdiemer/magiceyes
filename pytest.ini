[pytest]
# The harness modules under tools/ are plain scripts, not an installed package, so the import
# roots go here rather than in a pyproject: tools/mcp/pyproject.toml already defines a separate
# uv project and a second one at the repo root would collide with it.
#
# Run with:  uv run --with pytest --with numpy pytest
testpaths = tests/python
pythonpath = tools/test tools/mcp tools
addopts = -q --strict-markers
markers =
    needs_numpy: exercises code that imports numpy (tools/mcp audio analysis)
